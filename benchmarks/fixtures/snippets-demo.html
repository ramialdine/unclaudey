<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>unclaudey snippets demo</title>
<script>document.documentElement.classList.add('js')</script>
<style>
:root{--color-bg:#f3efe8;--color-ink:#231f1b;--color-accent:#9c4a2c;--color-accent-2:#d9a27b;--ease:cubic-bezier(.2,.7,.2,1);--dur-2:.8s;--dur-3:1s}
body{margin:0;background:var(--color-bg);color:var(--color-ink);font:18px/1.55 Georgia,serif}
main{max-width:1080px;margin:0 auto;padding:6vh 24px}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:center;min-height:70vh}
@media (max-width:760px){.hero{grid-template-columns:1fr}}
h1{font-size:clamp(40px,6vw,76px);line-height:1.02;margin:0}
[data-live] canvas{display:none;width:100%;aspect-ratio:1;touch-action:pan-y}
[data-live].is-live canvas{display:block} [data-live].is-live .live-fallback{display:none}
[data-live] canvas:focus-visible{outline:2px solid var(--color-accent);outline-offset:4px}
figure{margin:0} figcaption{font-size:15px} section{padding:10vh 0}
.draw-on path{fill:none;stroke:var(--color-accent);stroke-width:2.5;stroke-linecap:round}
/* unclaudey · drawings that draw themselves, and layers that assemble.
 * Requires <script>document.documentElement.classList.add('js')</script> in <head>, so
 * drawings stay fully visible if scripts never run.
 *
 * Draw-on:   <svg class="draw-on"> <path pathLength="1" style="--i:0" …/> <path pathLength="1" style="--i:1" …/> </svg>
 *            add class "on-scroll" to tie it to scrolling instead of load
 * Assemble:  <svg> <g class="assemble"> <g style="--i:0">…</g> <g style="--i:1">…</g> </g> </svg>
 */
@media (prefers-reduced-motion: no-preference) {
  .js .draw-on [pathLength] {
    stroke-dasharray: 1;
    stroke-dashoffset: 1;
    animation: uc-draw var(--dur-draw, 1.4s) var(--ease, cubic-bezier(.2, .7, .2, 1)) forwards;
    animation-delay: calc(var(--i, 0) * 140ms);
  }
  .js .assemble > g {
    transform-box: fill-box;
    transform-origin: 50% 100%;
    animation: uc-rise var(--dur-2, .8s) var(--ease, cubic-bezier(.2, .7, .2, 1)) both;
    animation-delay: calc(var(--i, 0) * 110ms);
  }
  @supports (animation-timeline: view()) {
    .js .draw-on.on-scroll [pathLength],
    .js .assemble.on-scroll > g {
      animation-timeline: view();
      animation-range: entry 10% cover 45%;
      animation-delay: 0s;
      animation-fill-mode: both;
    }
  }
}
@keyframes uc-draw { to { stroke-dashoffset: 0; } }
@keyframes uc-rise { from { transform: translateY(14px) scaleY(.96); opacity: 0; } }

/* unclaudey · photo reveal for a story beat (use on 2-3 photos, not every section).
 * Requires <script>document.documentElement.classList.add('js')</script> in <head>.
 *
 * Markup:  <figure class="reveal-photo"><img … width="…" height="…" alt="…"></figure>
 * Browsers with scroll timelines (Chrome, Edge, Safari 26+) animate with pure CSS. Others
 * (Firefox) get a one-time reveal from this tiny script, placed at the end of <body>:
 *
 *   <script>
 *   if (!CSS.supports('animation-timeline: view()') && 'IntersectionObserver' in window) {
 *     const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) {
 *       e.target.classList.add('is-in'); io.unobserve(e.target); } }), { threshold: .25 });
 *     document.querySelectorAll('.reveal-photo').forEach(el => io.observe(el));
 *   }
 *   </script>
 */
.reveal-photo { overflow: hidden; margin: 0; }
.reveal-photo img { display: block; width: 100%; height: auto; }

@media (prefers-reduced-motion: no-preference) {
  @supports (animation-timeline: view()) {
    .js .reveal-photo {
      animation: uc-open linear both;
      animation-timeline: view();
      animation-range: entry 0% cover 35%;
    }
    .js .reveal-photo img {
      animation: uc-settle linear both;
      animation-timeline: view();
      animation-range: entry 0% cover 50%;
    }
  }
  @supports not (animation-timeline: view()) {
    .js .reveal-photo { transition: clip-path var(--dur-3, .9s) var(--ease, cubic-bezier(.2, .7, .2, 1)); }
    .js .reveal-photo:not(.is-in) { clip-path: inset(10% 10% 10% 10%); }
  }
}
@keyframes uc-open { from { clip-path: inset(10% 10% 10% 10%); } to { clip-path: inset(0); } }
@keyframes uc-settle { from { transform: scale(1.08); } to { transform: none; } }

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main>
<header class="hero"><div><h1>Clay, centered.</h1><p>Six Tuesday evenings on the wheel, from a lump to a bowl you'll use.</p></div>
<figure class="live" data-live>
  <canvas role="img" aria-label="A pot on the wheel. Drag up or down, or use the arrow keys, to change its height."></canvas>
  <svg class="live-fallback" viewBox="0 0 200 200" role="img" aria-label="A pot on the wheel"><ellipse cx="100" cy="170" rx="80" ry="12" fill="#cfc6b8"/><path d="M62 168 C58 120 70 90 84 70 L116 70 C130 90 142 120 138 168 Z" fill="var(--color-accent)"/></svg>
  <figcaption>Drag the clay to shape it · <button type="button" data-live-reset>Start over</button></figcaption>
</figure></header>
<section><h2>The six weeks</h2>
<svg class="draw-on on-scroll" viewBox="0 0 600 120" role="img" aria-label="Six pots, growing from a lump to a finished bowl">
  <path pathLength="1" style="--i:0" d="M30 100 C30 80 70 80 70 100"/>
  <path pathLength="1" style="--i:1" d="M120 100 C118 70 150 70 148 100"/>
  <path pathLength="1" style="--i:2" d="M210 100 C200 60 250 60 240 100"/>
  <path pathLength="1" style="--i:3" d="M300 100 C285 50 355 50 340 100"/>
  <path pathLength="1" style="--i:4" d="M400 100 C380 45 460 45 440 100"/>
  <path pathLength="1" style="--i:5" d="M500 100 C475 40 570 40 545 100"/>
</svg></section>
<section><h2>The studio</h2><figure class="reveal-photo"><img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 9'%3E%3Cdefs%3E%3ClinearGradient id='g' x2='1' y2='1'%3E%3Cstop stop-color='%236b7f6f'/%3E%3Cstop offset='1' stop-color='%232c3a33'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='16' height='9' fill='url(%23g)'/%3E%3C/svg%3E" width="1600" height="900" alt="Placeholder gradient standing in for a studio photo"></figure></section>
<section><h2>Visit</h2><p>Southeast Portland. Open studio Tuesday to Saturday.</p></section>
</main>
<script>/* unclaudey · live object: the one interactive canvas centerpiece on a page.
 *
 * Markup (the static SVG is what people see if JavaScript never runs):
 *   <figure class="live" data-live>
 *     <canvas role="img" aria-label="A pot on the wheel. Drag or use arrow keys to shape it."></canvas>
 *     <svg class="live-fallback" viewBox="0 0 200 200" aria-hidden="true">…same object, drawn still…</svg>
 *     <figcaption>Drag across the clay to shape it · <button type="button" data-live-reset>Start over</button></figcaption>
 *   </figure>
 *
 * CSS:
 *   [data-live] canvas { display: none; width: 100%; aspect-ratio: 1; touch-action: pan-y; }
 *   [data-live].is-live canvas { display: block; }
 *   [data-live].is-live .live-fallback { display: none; }
 *   [data-live] canvas:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 4px; }
 *
 * Script:
 *   liveObject(document.querySelector('[data-live]'), {
 *     init(s)            { s.shape = 0; s.intro = 0; },            // your state
 *     intro(s, dt)       { s.intro = Math.min(1, s.intro + dt / 1400); return s.intro < 1; },  // once; true = keep going
 *     finishIntro(s)     { s.intro = 1; },                          // reduced motion: jump to the end
 *     step(s, dt)        { return false; },                         // ongoing physics; true = keep animating
 *     draw(ctx, s)       { … draw with s.w, s.h (CSS px) … },
 *     pointer(s, phase)  { … s.pointer = {x, y} … },                // 'down' | 'move' | 'up'
 *     key(s, key)        { if (key === 'ArrowUp') { s.shape += .05; return true; } },
 *     reset(s)           { s.shape = 0; },
 *   });
 */
function liveObject(root, o) {
  const canvas = root.querySelector('canvas');
  const ctx = canvas.getContext('2d');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
  const s = { w: 0, h: 0, dpr: 1, t: 0, pointer: null, visible: true };
  let running = false, last = 0, introOn = false;

  o.init && o.init(s);
  root.classList.add('is-live');
  canvas.tabIndex = 0;

  function render() { ctx.clearRect(0, 0, s.w, s.h); o.draw(ctx, s); }

  function resize() {
    const r = canvas.getBoundingClientRect();
    s.dpr = Math.min(window.devicePixelRatio || 1, 2);
    s.w = r.width; s.h = r.height;
    canvas.width = Math.max(1, Math.round(r.width * s.dpr));
    canvas.height = Math.max(1, Math.round(r.height * s.dpr));
    ctx.setTransform(s.dpr, 0, 0, s.dpr, 0, 0);
    render();
  }

  function frame(now) {
    const dt = last ? Math.min(64, now - last) : 16;
    last = now; s.t += dt;
    let more = false;
    if (introOn) { introOn = o.intro(s, dt); more = introOn; }
    if (o.step && o.step(s, dt)) more = true;
    render();
    if (more && s.visible && !document.hidden) requestAnimationFrame(frame);
    else { running = false; last = 0; }
  }
  function wake() { if (!running) { running = true; requestAnimationFrame(frame); } }

  function at(e) { const r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
  canvas.addEventListener('pointerdown', e => {
    canvas.setPointerCapture(e.pointerId); s.pointer = at(e); o.pointer && o.pointer(s, 'down'); wake();
  });
  canvas.addEventListener('pointermove', e => {
    if (!s.pointer) return; s.pointer = at(e); o.pointer && o.pointer(s, 'move'); wake();
  });
  const up = () => { if (!s.pointer) return; o.pointer && o.pointer(s, 'up'); s.pointer = null; wake(); };
  canvas.addEventListener('pointerup', up);
  canvas.addEventListener('pointercancel', up);
  canvas.addEventListener('keydown', e => { if (o.key && o.key(s, e.key)) { e.preventDefault(); wake(); } });
  const resetBtn = root.querySelector('[data-live-reset]');
  if (resetBtn && o.reset) resetBtn.addEventListener('click', () => { o.reset(s); wake(); });

  new ResizeObserver(resize).observe(canvas);
  new IntersectionObserver(([en]) => { s.visible = en.isIntersecting; if (s.visible) wake(); }).observe(canvas);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) wake(); });

  // one orchestrated intro; with reduced motion, show the finished state instead
  if (o.intro && !reduce.matches) { introOn = true; } else if (o.finishIntro) { o.finishIntro(s); }
  resize();
  wake();
  return { state: s, wake, render };
}

liveObject(document.querySelector('[data-live]'), {
  init(s) { s.hgt = .55; s.intro = 0; s.spin = 0; },
  intro(s, dt) { s.intro = Math.min(1, s.intro + dt / 1300); return s.intro < 1; },
  finishIntro(s) { s.intro = 1; },
  step(s, dt) { s.spin += dt * .004; return !!s.pointer; },
  pointer(s, phase) { if (phase !== 'up' && s.pointer) s.hgt = Math.max(.25, Math.min(.9, 1 - s.pointer.y / s.h)); },
  key(s, k) { if (k === 'ArrowUp') { s.hgt = Math.min(.9, s.hgt + .05); return true; } if (k === 'ArrowDown') { s.hgt = Math.max(.25, s.hgt - .05); return true; } },
  reset(s) { s.hgt = .55; },
  draw(c, s) {
    const e = 1 - Math.pow(1 - s.intro, 3), cx = s.w / 2, base = s.h * .82, H = s.h * s.hgt * e, W = s.w * .22;
    c.fillStyle = '#cfc6b8'; c.beginPath(); c.ellipse(cx, base + 6, s.w * .4, s.h * .05, 0, 0, Math.PI * 2); c.fill();
    const g = c.createLinearGradient(cx - W, 0, cx + W, 0); g.addColorStop(0, '#d9a27b'); g.addColorStop(1, '#9c4a2c');
    c.fillStyle = g; c.beginPath(); c.moveTo(cx - W, base);
    c.bezierCurveTo(cx - W * 1.25, base - H * .5, cx - W * .6, base - H * .8, cx - W * .55, base - H);
    c.lineTo(cx + W * .55, base - H); c.bezierCurveTo(cx + W * .6, base - H * .8, cx + W * 1.25, base - H * .5, cx + W, base);
    c.closePath(); c.fill();
  },
});
if (!CSS.supports('animation-timeline: view()') && 'IntersectionObserver' in window) {
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('is-in'); io.unobserve(e.target); } }), {threshold: .25});
  document.querySelectorAll('.reveal-photo').forEach(el => io.observe(el));
}
</script></body></html>
